name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t iou-backend .
      - name: El contenedor arranca y valida su entorno
        run: |
          docker run --rm -e CORS_ORIGIN=http://localhost iou-backend node dist/server.js && exit 1 || echo "Sin DATABASE_URL termina con error, como se espera"
